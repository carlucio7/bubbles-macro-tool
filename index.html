<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Editor de macros do Corsair iCUE em bolhas: abra o perfil exportado (.cueprofile), monte e edite macros arrastando bolhas, assista à prévia e salve uma cópia editada. Tudo roda no navegador; o perfil não é enviado a lugar nenhum."><meta property="og:title" content="Bubbles Macro Extension Tool"><meta property="og:description" content="Editor de macros do Corsair iCUE em bolhas: abra o perfil exportado (.cueprofile), monte e edite macros arrastando bolhas, assista à prévia e salve uma cópia editada. Tudo roda no navegador; o perfil não é enviado a lugar nenhum."><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 30'%3E%3Ccircle cx='10' cy='18' r='9.5' fill='%237B5CFA' fill-opacity='.55' stroke='%237B5CFA' stroke-width='1.5'/%3E%3Ccircle cx='24' cy='8' r='6.5' fill='%23E85C9A' fill-opacity='.55' stroke='%23E85C9A' stroke-width='1.5'/%3E%3Ccircle cx='26.5' cy='22.5' r='5' fill='%2334C38A' fill-opacity='.55' stroke='%2334C38A' stroke-width='1.5'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Bubbles Macro Extension Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one screen like a desktop program - a slim bar on top, then the page (a field of bubbles, or one
   macro with its stage); on a narrow screen everything stacks and the page scrolls. The colours are the
   ones the Bubbles design was approved with: a breath of lilac, one violet for the main action, and every
   kind of macro in its own family of soft glass colours. */
:root {
  --bg: #F5F2FC; --card: #FFFFFF; --ink: #2B2640; --muted: #6F6988; --line: #DDD6F0; --faint: #B5AFCA;
  --accent: #7B5CFA; --accent-ink: #6747EC; --accent-soft: #E9E2FF; --accent-hot: #6747EC; --on-accent: #FFFFFF;
  --hover: #F1ECFF; --head: #EFEAFB; --ghost: #B9A9F5; --ring: #C3B6EE;
  --good: #1D8754; --warn: #B4680F; --danger: #C83A60; --note: #E7F5EA; --note-ink: #14532D; --note-warn: #FFF3D6; --note-warn-ink: #6B4500;
  --step-key: #2563C9; --step-mouse: #16895A; --step-block: #A0620A; --step-part: #0C6F7A; --step-part-bg: #E4F7F8;
  --bub-l: 70%; --bub-shine: .78; --bub-ink: #2B2640; --bub-core: .18; --box-a: .16; --box-ink: 32%; --shadow: 52 44 84; --veil: rgb(43 38 64 / .38);
  --spark: #7B5CFA; --cap: #FFFFFF; --cap-edge: #C9C1E6; --screen: #1E1B2B;
  --steel: #6B6680; --iron: #3A3648; --wood: #C99355; --solid-l: 86%; --solid-ink: #2B2640;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --round: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151F; --card: #211E2D; --ink: #ECE9F7; --muted: #A9A3C2; --line: #3A3552; --faint: #625C7B;
    --accent: #8468F5; --accent-ink: #B9A8FF; --accent-soft: #342C57; --accent-hot: #957BFF; --on-accent: #FFFFFF;
    --hover: #2C2842; --head: #292538; --ghost: #8F7EE0; --ring: #5D5585;
    --good: #4CC38A; --warn: #E5A04A; --danger: #F0708F; --note: #1F3A2B; --note-ink: #B7F0CB; --note-warn: #3E3216; --note-warn-ink: #F3D58C;
    --step-key: #7FB0FF; --step-mouse: #5FD3A2; --step-block: #E9B25F; --step-part: #6FD6E0; --step-part-bg: #1D3A40;
    --bub-l: 68%; --bub-shine: .26; --bub-ink: #F6F3FF; --bub-core: .14; --box-a: .13; --box-ink: 78%; --shadow: 3 2 8; --veil: rgb(5 4 10 / .6);
    --spark: #C9BCFF; --cap: #2E2A40; --cap-edge: #5A5378; --screen: #0E0D14;
    --steel: #C9C4DD; --iron: #9692AA; --wood: #D9A56B; --solid-l: 38%; --solid-ink: #F6F3FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151F; --card: #211E2D; --ink: #ECE9F7; --muted: #A9A3C2; --line: #3A3552; --faint: #625C7B;
  --accent: #8468F5; --accent-ink: #B9A8FF; --accent-soft: #342C57; --accent-hot: #957BFF; --on-accent: #FFFFFF;
  --hover: #2C2842; --head: #292538; --ghost: #8F7EE0; --ring: #5D5585;
  --good: #4CC38A; --warn: #E5A04A; --danger: #F0708F; --note: #1F3A2B; --note-ink: #B7F0CB; --note-warn: #3E3216; --note-warn-ink: #F3D58C;
  --step-key: #7FB0FF; --step-mouse: #5FD3A2; --step-block: #E9B25F; --step-part: #6FD6E0; --step-part-bg: #1D3A40;
  --bub-l: 68%; --bub-shine: .26; --bub-ink: #F6F3FF; --bub-core: .14; --box-a: .13; --box-ink: 78%; --shadow: 3 2 8; --veil: rgb(5 4 10 / .6);
  --spark: #C9BCFF; --cap: #2E2A40; --cap-edge: #5A5378; --screen: #0E0D14;
  --steel: #C9C4DD; --iron: #9692AA; --wood: #D9A56B; --solid-l: 38%; --solid-ink: #F6F3FF;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .brand-name, .bub-label, .zone-title, .box-title { font-family: var(--round); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; width: 100%; }
kbd { font: 600 12px var(--mono); padding: 1px 6px; border: 1px solid var(--cap-edge); border-bottom-width: 2px; border-radius: 6px; background: var(--cap); }
.grow { flex: 1 1 0; min-width: 0; }
.hint { color: var(--muted); font-size: 12.5px; white-space: pre-line; }

#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
#app, .menu, .pick { user-select: none; -webkit-user-select: none; }
input, textarea, .banner span, .msg { user-select: text; -webkit-user-select: text; }
.top, .banner, .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding-block: 10px 8px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; line-height: 1; display: flex; flex-direction: column; }
.brand-name small { font: 600 10px var(--font); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.logo { position: relative; width: 34px; height: 30px; flex: none; }
.logo i { position: absolute; border-radius: 50%; border: 1.5px solid; }
.logo i:nth-child(1) { width: 20px; height: 20px; left: 0; top: 8px; background: hsl(262 92% 70% / .45); border-color: hsl(262 80% 60% / .8); }
.logo i:nth-child(2) { width: 14px; height: 14px; left: 17px; top: 1px; background: hsl(338 92% 70% / .45); border-color: hsl(338 80% 60% / .8); }
.logo i:nth-child(3) { width: 11px; height: 11px; left: 21px; top: 17px; background: hsl(152 82% 60% / .45); border-color: hsl(152 60% 45% / .8); }
.file-name { color: var(--muted); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-name.example { color: var(--warn); font-weight: 600; }
.status { color: var(--muted); font-size: 12.5px; text-align: right; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.dirty { color: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 12px; white-space: nowrap; transition: background .12s, border-color .12s, transform .08s; }
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--ring); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { color: var(--faint); background: transparent; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.accent:hover:not(:disabled) { background: var(--accent-hot); border-color: var(--accent-hot); }
.btn.accent:disabled { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--faint); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn.big { padding: 9px 18px; font-size: 15px; border-radius: 12px; }
.draft-offer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.draft-offer[hidden] { display: none; }
.btn.create { padding: 3px; border: 2px solid var(--accent-ink); border-radius: 16px; background: transparent; }
.btn.create > span { display: inline-block; background: linear-gradient(90deg, #8468F5, #E85C9A); color: #fff; border-radius: 12px; padding: 7px 18px; font: 800 15px var(--round); }
.btn.create:hover:not(:disabled) { background: transparent; border-color: var(--accent-hot); }
.btn.create:hover:not(:disabled) > span { background: linear-gradient(90deg, #957BFF, #F06AA8); }
.btn.create:disabled { opacity: .45; background: transparent; }
.btn.small { padding: 3px 9px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 6px 10px; }
.icon-btn { border: 0; background: transparent; border-radius: 8px; padding: 4px 8px; color: inherit; }
.icon-btn:hover { background: var(--hover); }
.link { border: 0; background: transparent; color: var(--accent-ink); text-decoration: underline; padding: 2px 4px; }

.banner { display: flex; align-items: center; gap: 12px; padding-block: 7px; background: var(--note-warn); color: var(--note-warn-ink); }
.banner.good { background: var(--note); color: var(--note-ink); }
.banner span { flex: 1; min-width: 0; }
.page { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding-block: 4px 10px; }

/* ---------------------------------------------------------------- bubbles */
.bub {
  --h: 262; --sat: 92%; --tone: 0; --l: calc(var(--bub-l) + var(--tone) * 3.5%);
  position: relative; display: inline-grid; place-items: center; align-content: center; text-align: center; border-radius: 50%; padding: 0; flex: none;
  color: var(--bub-ink);
  background:
    radial-gradient(58% 44% at 33% 23%, rgb(255 255 255 / var(--bub-shine)) 0, transparent 72%),
    radial-gradient(circle at 50% 56%, hsl(var(--h) var(--sat) var(--l) / var(--bub-core)) 28%, hsl(var(--h) var(--sat) var(--l) / .6) 80%, hsl(var(--h) var(--sat) calc(var(--l) - 9%) / .86) 100%);
  border: 1.5px solid hsl(var(--h) var(--sat) calc(var(--l) - 13%) / .72);
  box-shadow: 0 8px 18px -8px hsl(var(--h) 55% 38% / .5), inset 0 -9px 16px -9px hsl(var(--h) var(--sat) calc(var(--l) - 12%) / .75);
}
.bub-label { font-weight: 700; line-height: 1.12; padding: 0 9%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; max-width: 100%; }
.bub-key { font: 700 .78em var(--font); margin-top: .25em; padding: .05em .55em; border-radius: 99px; background: rgb(255 255 255 / .55); color: #2B2640; border: 1px solid rgb(0 0 0 / .08); }
.bub-sub { font-size: .8em; opacity: .75; margin-top: .1em; }
.fieldbub { --size: calc(var(--d, 84px) * var(--fz, 1)); width: var(--size); height: var(--size); font-size: clamp(9.5px, calc(var(--size) * .135), 17px);
  transition: scale .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s; animation: drift calc(6s + var(--i, 0) * .45s) ease-in-out calc(var(--i, 0) * -1.37s) infinite; }
.fieldbub:hover, .fieldbub:focus-visible { scale: 1.07; z-index: 2; }
.fieldbub.model { border-style: dashed; border-width: 2px; --d: 82px; }
.fieldbub.model .bub-icon { font-size: 1.55em; line-height: 1.05; }
.fieldbub.model .bub-label { font-size: .88em; -webkit-line-clamp: 2; }
.fieldbub.next::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2.5px solid var(--accent); animation: ring 1.6s ease-in-out infinite; }
.fieldbub.lifted { opacity: .35; }
.carried-out { position: fixed; z-index: 90; pointer-events: none; rotate: -4deg; scale: 1.05; animation: none; box-shadow: 0 16px 30px -10px rgb(var(--shadow) / .55); }
.carried-out.over { rotate: 0deg; }
.field > :nth-child(7n+1), .palette > :nth-child(7n+1), .flow > :nth-child(7n+1) { --i: 1; }
.field > :nth-child(7n+2), .palette > :nth-child(7n+2), .flow > :nth-child(7n+2) { --i: 2; }
.field > :nth-child(7n+3), .palette > :nth-child(7n+3), .flow > :nth-child(7n+3) { --i: 3; }
.field > :nth-child(7n+4), .palette > :nth-child(7n+4), .flow > :nth-child(7n+4) { --i: 4; }
.field > :nth-child(7n+5), .palette > :nth-child(7n+5), .flow > :nth-child(7n+5) { --i: 5; }
.field > :nth-child(7n+6), .palette > :nth-child(7n+6), .flow > :nth-child(7n+6) { --i: 6; }
@keyframes drift { 0%, 100% { translate: 0 0; } 25% { translate: 2px -3px; } 50% { translate: -2px -5px; } 75% { translate: -3px 1px; } }
@keyframes ring { 0%, 100% { opacity: .9; scale: 1; } 50% { opacity: .35; scale: 1.06; } }
body.still .fieldbub, body.still .piece > .bub, body.still .minis { animation: none; }
body.solid .bub { color: var(--solid-ink);
  background: radial-gradient(58% 44% at 33% 23%, rgb(255 255 255 / .45) 0, transparent 72%), hsl(var(--h) var(--sat) calc(var(--solid-l) + var(--tone) * 2.2%)); }

/* ---------------------------------------------------------------- welcome */
.welcome { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center; padding-block: 12px; }
.welcome-text { display: flex; flex-direction: column; gap: 16px; max-width: 64ch; }
.welcome h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; line-height: 1.08; }
.lead { font-size: 16px; color: var(--muted); max-width: 54ch; }
.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.howto li { display: flex; align-items: center; gap: 12px; }
.bub.num { width: 34px; height: 34px; font: 800 14px var(--round); }
.welcome-art { position: relative; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-content: center; padding: 20px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ---------------------------------------------------------------- home */
.home { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.home-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
input.field, select.field { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 5px 9px; min-width: 0; max-width: 100%; }
input.field:focus, select.field:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input.num { text-align: right; font-variant-numeric: tabular-nums; }
.search { width: 24ch; }
.guide { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 7px 14px; }
.zones { flex: 1 1 0; min-height: 120px; overflow: auto; display: flex; gap: 14px; align-items: flex-start; padding: 6px 2px; }
.zone { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.zones.two .zone-models { flex: 0 1 34%; border-left: 1px dashed var(--line); padding-left: 14px; }
.zone-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
div.field { border: 0; background: transparent; padding: 4px; display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: calc(10px * var(--fz, 1)) calc(12px * var(--fz, 1)); }
.empty { color: var(--muted); padding: 30px; }
.home-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-height: 22px; color: var(--muted); font-size: 12.5px; }
.info { flex: 1 1 30ch; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: hsl(var(--h, 262) var(--sat, 92%) var(--bub-l) / .7); border: 1px solid hsl(var(--h, 262) var(--sat, 92%) 50% / .7); }
.tray { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; height: min(250px, 31vh); min-height: 170px; min-width: 0; }
.tray .stage { flex: 1 1 0; border: 0; }
.tray-side { display: flex; flex-direction: column; gap: 5px; padding: 6px 8px; width: 250px; flex: none; }
.lbl { color: var(--muted); font-size: 12.5px; }

/* ---------------------------------------------------------------- the page of a macro */
.macro { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.macro-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
input.name { flex: 1 1 22ch; font: 700 17px var(--round); padding: 6px 12px; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 5px 22px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; }
.set { display: flex; align-items: center; gap: 10px; min-width: 0; }
.set-l { flex: none; width: 9ch; color: var(--muted); font-size: 12.5px; }
.set-v { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.key-now { font-size: 15px; }
.extra-now { color: var(--muted); font-size: 12.5px; }
.links { color: var(--accent-ink); font-size: 12.5px; }
.work { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; }
.stage-card { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.palette-title { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 14px 0; }
.palette { container-type: inline-size; display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 8px 14px 10px; flex: none; border-bottom: 1px dashed var(--line); }
@media (max-height: 700px) { .palette { flex-wrap: nowrap; overflow-x: auto; } .palette-title { display: none; } }
.palette .fieldbub { --d: clamp(64px, calc((100cqw - 121px) / 13), 88px); }
.side-panel, .monitor { flex: 0 0 clamp(250px, 27%, 380px); min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.side-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.steplist { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; font-size: 13px; outline: none; touch-action: pan-y; }
.steplist:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
.steplist.in-dialog { flex: none; height: min(340px, 42vh); border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.steplist.dragging { cursor: grabbing; }
.steplist.dragging .steprow.on { box-shadow: inset 3px 0 0 var(--accent); }
.steplist .more { padding: 8px 12px; }
.steptools { display: flex; flex-wrap: wrap; align-items: center; gap: 1px; padding: 3px 6px; border-bottom: 1px solid var(--line); flex: none; }
.modal .steptools { border: 0; padding: 0; }
.tool-gap { width: 8px; }
.side-foot { padding: 5px 12px 7px; border-top: 1px solid var(--line); flex: none; }
.check.wide-label { min-width: 30ch; }
.steprow { display: flex; gap: 8px; padding: 2px 10px 2px 0; cursor: default; touch-action: none; }
.steprow .n { flex: none; width: 4.5ch; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
.steprow .what { min-width: 0; overflow-wrap: anywhere; }
.steprow.on { background: var(--accent-soft); }
.steprow:hover { background: var(--hover); }
.steprow.wait, .step.wait { color: var(--muted); }
.steprow.keyboard, .step.keyboard { color: var(--step-key); }
.steprow.mouse, .step.mouse { color: var(--step-mouse); }

.steprow.part { color: var(--step-part); background: var(--step-part-bg); font-weight: 600; }

/* ---------------------------------------------------------------- the stage */
.stage { position: relative; flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; outline: none; border-radius: 12px; }
.stage:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }

.stage.framed .stage-scroll .flow.root { border: 2px dashed var(--ring); border-radius: calc(var(--z) * 22px); padding: calc(var(--z) * 14px); background: var(--accent-soft); background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.frame-title { font: 800 max(12px, calc(var(--z) * 13px)) var(--round); color: var(--accent-ink); padding: 0 6px 6px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--z) * 12px) calc(var(--z) * 16px); }
.flow.root { min-height: calc(var(--z) * 40px); width: fit-content; max-width: 100%; }
.piece { position: relative; display: flex; flex-direction: column; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.piece > .bub { animation: drift calc(6s + var(--i, 0) * .45s) ease-in-out calc(var(--i, 0) * -1.37s) infinite; transition: scale .16s cubic-bezier(.2,.8,.2,1); }
.piece.leaf:hover > .bub { scale: 1.07; }
.piece .bub { font-size: max(9px, calc(var(--z) * 11.5px)); }
.piece.play > .bub { width: calc(var(--z) * 86px); height: calc(var(--z) * 86px); }
.piece.steps > .bub { width: calc(var(--z) * 74px); height: calc(var(--z) * 74px); }
.piece.wait > .bub { width: max(34px, calc(var(--z) * 42px)); height: max(34px, calc(var(--z) * 42px)); font-size: max(9px, calc(var(--z) * 10px)); --sat: 30%; }
.piece.wait .bub-icon { font-size: .95em; line-height: 1; }
.piece.wait .bub-label { font-weight: 700; padding: 0; }
.minis { position: relative; width: calc(var(--z) * var(--size) * 1px); height: calc(var(--z) * var(--size) * 1px); animation: drift 7s ease-in-out infinite; }
.bub.mini { position: absolute; left: calc(var(--z) * var(--x) * 1px); top: calc(var(--z) * var(--y) * 1px); width: calc(var(--z) * var(--rm) * 2px); height: calc(var(--z) * var(--rm) * 2px); border-width: 1px; box-shadow: none; }
.piece.bunch.wait .bub.mini { --sat: 30%; }
.bunch-text { display: flex; flex-direction: column; align-items: center; margin-top: calc(var(--z) * 4px); font-size: max(9.5px, calc(var(--z) * 11.5px)); line-height: 1.15; max-width: calc(var(--z) * 190px); text-align: center; }
.bunch-text b { font-family: var(--round); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.bunch-text span { color: var(--muted); font-variant-numeric: tabular-nums; }
.piece.box { align-items: stretch; background: hsl(var(--h) 85% 62% / var(--box-a)); border: 1px solid hsl(var(--h) 60% 58% / .38); border-radius: calc(var(--z) * 18px); padding: calc(var(--z) * 6px) calc(var(--z) * 12px) calc(var(--z) * 12px); }
.piece.box.named { border-width: 2px; }
.box-head { display: flex; align-items: baseline; gap: 10px; padding: 0 2px calc(var(--z) * 6px); font-size: max(10px, calc(var(--z) * 12px)); }
.box-title { font-weight: 800; color: hsl(var(--h) 55% var(--box-ink)); }
.box-count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.box-count.tick { animation: tick .3s ease-out; }
.box-empty { color: var(--muted); font-size: 12px; padding: 8px 20px; }
.piece.ghost { border: 2px dashed var(--ghost); border-radius: calc(var(--z) * 16px); cursor: default; }
.piece.ghost.round { border-radius: 50%; }
.piece.ghost.slot { width: calc(var(--z) * 10px); border: none; border-radius: 99px; background: var(--accent); opacity: .75; box-shadow: 0 0 0 calc(var(--z) * 4px) rgb(123 92 250 / .22); }
.piece.sel > .bub, .piece.sel > .minis { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 50%; }
.piece.box.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.piece.box.opening { outline: 2px dashed var(--accent); outline-offset: 3px; }
.piece.box.open { outline: 3px solid var(--accent); outline-offset: 3px; }
.piece.join > .bub, .piece.join > .minis { outline: 3px dashed var(--accent); outline-offset: 5px; border-radius: 50%; animation: ring 1s ease-in-out infinite; }
.piece.carried { position: fixed; z-index: 80; pointer-events: none; cursor: grabbing; rotate: -3deg; filter: drop-shadow(0 14px 16px rgb(var(--shadow) / .35)); transition: opacity .15s, scale .15s; }
.piece.carried.away { opacity: .55; scale: .82; }
.stage.dragging { cursor: grabbing; }
.stage-fx { position: absolute; left: 0; top: 0; width: 100%; min-height: 100%; pointer-events: none; overflow: visible; }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; pointer-events: none; }
.stage-say { flex: none; min-height: 26px; padding: 4px 14px 6px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-tools { position: absolute; top: 8px; right: 10px; z-index: 20; display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; box-shadow: 0 8px 20px -10px rgb(var(--shadow) / .5); }
.tool { border: 0; background: transparent; border-radius: 9px; min-width: 30px; height: 30px; padding: 0 7px; font-size: 14px; }
.tool:hover { background: var(--hover); }
.tool.wide { font-weight: 600; color: var(--accent-ink); }
.tool.danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
.tool-count { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; font-size: 13px; }
@keyframes tick { 0% { scale: 1.35; color: var(--accent-ink); } 100% { scale: 1; } }

/* ---------------------------------------------------------------- the preview */
.stage.playing .piece { cursor: default; }
.stage.playing .piece > .bub, .stage.playing .minis { animation: none; }
.stage.playing .piece.done > .bub, .stage.playing .bub.mini.done { background: transparent; box-shadow: none; border-style: dotted; opacity: .55; }
.stage.playing .piece.live > .bub { scale: 1.08; }
.bub.hit { animation: hit .38s cubic-bezier(.2,.8,.2,1) !important; }
@keyframes hit { 0% { scale: 1.32; filter: brightness(1.5) saturate(1.3); } 100% { scale: 1; filter: none; } }
.fx-canvas { position: absolute; left: 0; top: 0; }
.fx-ring { position: absolute; left: 0; top: 0; overflow: visible; }
.ring-back { fill: none; stroke: var(--ring); stroke-width: 3; opacity: .45; }
.ring-front { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
.shot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #fff 0 22%, var(--spark) 55%, transparent 72%); box-shadow: 0 0 14px 5px color-mix(in srgb, var(--spark) 65%, transparent); will-change: transform; }
.stage.paused .shot { animation: ring .8s ease-in-out infinite; }
.tok-row { position: absolute; display: flex; gap: 6px; align-items: flex-end; translate: -50% -100%; transition: opacity .4s; white-space: nowrap; }
.tok-row .cap.small { min-width: max(30px, calc(var(--z) * 28px)); height: max(30px, calc(var(--z) * 28px)); padding: 0 7px; font-size: max(14px, calc(var(--z) * 13px)); border-radius: 8px; border-bottom-width: 3px; }
.tok-row .mouse-pic { width: max(22px, calc(var(--z) * 20px)); height: max(32px, calc(var(--z) * 29px)); }
.tok-row .arrow-pic { width: max(28px, calc(var(--z) * 26px)); height: max(28px, calc(var(--z) * 26px)); stroke-width: 3; }
.tok-row .tok-move, .tok-row .tok-scroll, .tok-row .tok-wait { font-size: max(14px, calc(var(--z) * 13px)); padding: 3px 11px 3px 6px; }
.monitor .cap.small { min-width: 25px; height: 25px; font-size: 12px; }
.monitor .mouse-pic { width: 17px; height: 25px; }
.tok-row.fading { opacity: 0; }
.tok { display: inline-flex; align-items: center; gap: 3px; transition: opacity .3s, translate .3s; }
.tok.act { animation: tokin .26s cubic-bezier(.2,.9,.3,1.3); }
.tok.old { opacity: 0; translate: 0 -8px; }
@keyframes tokin { 0% { scale: .4; translate: 0 10px; opacity: 0; } 100% { scale: 1; translate: 0 0; opacity: 1; } }
.cap { display: inline-flex; align-items: center; justify-content: center; min-width: calc(var(--w, 1) * 34px + (var(--w, 1) - 1) * 4px); height: 34px; padding: 0 6px; font: 600 12px var(--font); color: var(--ink);
  background: var(--cap); border: 1px solid var(--cap-edge); border-bottom-width: 3px; border-radius: 7px; white-space: nowrap; }
button.cap:hover { background: var(--hover); border-color: var(--accent); }
.cap.on { background: var(--accent-soft); border-color: var(--accent); }
.cap.small { min-width: 22px; height: 22px; padding: 0 5px; font-size: 11px; border-radius: 6px; border-bottom-width: 2px; }
.tok.act > .cap, .cap.tok.act { animation: tokin .26s cubic-bezier(.2,.9,.3,1.3), press .3s .1s; }
.cap.held, .tok.held.cap { translate: 0 2px; border-bottom-width: 1px; background: var(--accent-soft); border-color: var(--accent); }
@keyframes press { 0%, 100% { translate: 0 0; } 45% { translate: 0 3px; border-bottom-width: 1px; } }
.mouse-pic { width: 15px; height: 22px; overflow: visible; }
.mouse-body { fill: var(--cap); stroke: var(--cap-edge); stroke-width: 1.4; }
.mb { fill: transparent; }
.mb.lit { fill: var(--accent); }
.tok-mouse.held .mb.lit { fill: var(--danger); }
.tok-mouse.twice .mouse-pic { animation: twice .32s; }
@keyframes twice { 0%, 50%, 100% { scale: 1; } 25%, 75% { scale: .82; } }
.arrow-pic { width: 18px; height: 18px; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tok-move, .tok-scroll, .tok-wait { font: 600 11px var(--font); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px 1px 4px; font-variant-numeric: tabular-nums; }
.tok-scroll, .tok-wait { padding: 2px 8px; }
.monitor { padding: 0 0 8px; gap: 6px; }
.mon-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mon-time { display: flex; align-items: baseline; gap: 4px; padding: 2px 12px 0; }
.mon-clock { font: 800 22px var(--round); font-variant-numeric: tabular-nums; }
.mon-total, .mon-round { color: var(--muted); font-size: 12.5px; }
.mon-bar { height: 5px; margin: 0 12px; border-radius: 9px; background: var(--head); overflow: hidden; }
.mon-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9px; }
.mon-piece { padding: 0 12px; min-height: 1.4em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mon-screen { position: relative; margin: 2px 12px; background: var(--screen); border-radius: 8px; border: 3px solid #3A3552; overflow: hidden; max-height: 34%; }
.mon-pic { position: absolute; left: 0; top: 0; display: block; opacity: .9; pointer-events: none; }
.mon-pic[hidden] { display: none; }
.mon-paste { position: absolute; left: 8px; top: 6px; right: 34px; color: rgb(255 255 255 / .45); font-size: 11px; line-height: 1.3; }
.mon-big-btn { position: absolute; right: 4px; top: 4px; z-index: 2; width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgb(255 255 255 / .25); background: rgb(0 0 0 / .45); color: #fff; font-size: 15px; line-height: 1; }
.mon-big-btn:hover { background: var(--accent); }
.mon-big { position: fixed; inset: 0; z-index: 260; background: rgb(10 8 18 / .72); display: grid; place-items: center; }
.mon-screen.big { margin: 0; max-height: none; border-width: 4px; box-shadow: 0 20px 60px rgb(0 0 0 / .6); }

.mon-screen.big .mon-trail { height: 3px; }
.mon-screen-size { position: absolute; right: 6px; bottom: 3px; color: rgb(255 255 255 / .35); font: 10px var(--mono); }
.mon-cursor { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #7B5CFA, 0 0 10px 2px rgb(123 92 250 / .8); transition: left .12s ease-out, top .12s ease-out; }
.mon-cursor.down { background: #FF9DB5; }

@keyframes ripple { to { scale: 4.5; opacity: 0; } }
.mon-trail { position: absolute; height: 2px; margin-top: -1px; transform-origin: 0 50%; background: linear-gradient(90deg, transparent, #B9A8FF); animation: fade .9s ease-out forwards; }
@keyframes fade { to { opacity: 0; } }
.mon-label { padding: 2px 12px 0; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.mon-held { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px; min-height: 24px; align-items: center; }
.mon-tape { flex: 1 1 0; min-height: 60px; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px 6px; padding: 2px 12px; }
.tape-item { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; animation: tokin .2s; }
.tape-item.wait { color: var(--muted); font-size: 11px; }

.tape-group { border: 1px dashed var(--ring); border-radius: 8px; padding: 2px 5px; }
.times { color: var(--accent-ink); font-size: 12px; margin-left: 1px; font-variant-numeric: tabular-nums; }
.mon-end { margin: 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--note); color: var(--note-ink); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

/* ---------------------------------------------------------------- dialogs, menus, messages */
.modal-back { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--veil); padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); overflow: auto; }
.modal { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 60px -20px rgb(var(--shadow) / .6); animation: modal .18s cubic-bezier(.2,.9,.3,1.1); }
.modal.wide { width: min(900px, 100%); }
.modal.shake { animation: shake .25s; }
@keyframes modal { from { scale: .96; opacity: 0; translate: 0 8px; } }
@keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 6px 18px; }

.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
.msg { white-space: pre-line; max-width: 62ch; }
.biglink { color: var(--accent-ink); font-weight: 700; font-size: 15px; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.big { font-size: 17px; }
.fields { display: flex; flex-direction: column; gap: 8px; }
.fields.quick { min-height: 300px; }
.check { display: inline-flex; align-items: center; gap: 7px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.listbox { flex: 1 1 22ch; min-width: 0; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font-size: 13px; }
.listbox:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.listrow { padding: 3px 9px; cursor: default; white-space: nowrap; }
.listrow.on { background: var(--accent-soft); }
.split { display: flex; gap: 8px; align-items: flex-start; }
.split .side { display: flex; flex-direction: column; gap: 5px; flex: none; }
.quick-cols { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 18px; }
.quick-left { display: flex; flex-direction: column; gap: 7px; }
.quick-right, .quick-bottom { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.help { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; max-width: 78ch; }
.kb-scroll { overflow-x: auto; padding-bottom: 6px; }
.kb { display: flex; gap: 14px; width: max-content; }
.kb-block { display: flex; flex-direction: column; gap: 4px; }
.kb-row { display: flex; gap: 4px; min-height: 34px; }
.kb-gap { width: calc(var(--w, 1) * 34px + (var(--w, 1) - 1) * 4px); flex: none; }
.kb .cap { width: calc(var(--w, 1) * 34px + (var(--w, 1) - 1) * 4px); min-width: 0; padding: 0 2px; font-size: 11px; overflow: hidden; flex: none; }
.kb-strip, .kb-extra { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 36px; }
.menu { position: fixed; z-index: 300; min-width: 200px; max-width: min(360px, 94vw); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px; box-shadow: 0 18px 40px -14px rgb(var(--shadow) / .6); display: flex; flex-direction: column; }
.menu hr { margin: 4px 0; }
.menu-item { display: flex; justify-content: space-between; gap: 18px; align-items: center; border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; text-align: left; white-space: pre-wrap; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--hover); outline: none; }
.menu-item:disabled { color: var(--faint); }
.menu-item.danger { color: var(--danger); }

.toasts { position: fixed; z-index: 400; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 560px); }
.toast { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 14px; box-shadow: 0 12px 30px -12px rgb(var(--shadow) / .7); animation: tokin .22s; transition: opacity .35s; text-align: center; }

.toast.gone { opacity: 0; }
.veil { position: fixed; inset: 0; z-index: 500; display: grid; place-items: center; background: var(--veil); }
.veil-box { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 14px 20px; font-weight: 600; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
body.dropping::after { content: ""; position: fixed; inset: 8px; z-index: 450; border: 3px dashed var(--accent); border-radius: 18px; background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; }

/* ---------------------------------------------------------------- how to export: a drawing of the export window of iCUE
   (it is dark in iCUE whatever the theme of this page: its colours are its own) */

.icue-menu { display: flex; flex-direction: column; background: #FFFFFF; color: #1E1E1E; border-radius: 4px; padding: 4px 0; min-width: 150px; box-shadow: 0 6px 16px rgb(0 0 0 / .5); }

.icue-rest { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 44px 0 0 16px; }

.icue-body { display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr); }
.icue-tabs { background: #333333; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.icue-tabs span { position: relative; padding: 6px 10px; border-radius: 5px; color: #B5B5B5; font-size: 13.5px; }
.icue-tabs span.on { background: #4A4A4A; color: #fff; }
.icue-main { padding: 16px 24px 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.icue-row { display: flex; align-items: center; gap: 10px; }
.icue-row > span:first-child { flex: 1 1 0; min-width: 0; }
.icue-icon { flex: none; width: 26px; height: 26px; border-radius: 5px; background: #6B6B6B; }
.icue-select { position: relative; flex: 1.4 1 0; min-width: 0; display: flex; justify-content: space-between; gap: 6px; background: #4A4A4A; border-radius: 5px; padding: 5px 9px; white-space: nowrap; }
.icue-select i { font-style: normal; color: #C8C8C8; }
.icue-sub { color: #9A9A9A; }
.icue-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 4px 22px; }
.icue-col { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.icue-opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }

.icue-toggle { flex: none; position: relative; width: 26px; height: 9px; border-radius: 9px; background: #5A5A5A; }

.icue-hot { position: relative; display: flex; flex-direction: column; gap: 9px; margin: -6px -8px; padding: 6px 8px; border: 2px solid #A892FF; border-radius: 8px; background: rgb(123 92 250 / .22); }

@media (max-width: 860px) { .guide-cols { grid-template-columns: minmax(0, 1fr); } }

/* ---------------------------------------------------------------- pick on screen */
.pick-back { padding: 10px; place-items: stretch; z-index: 250; }
.pick { display: flex; flex-direction: column; min-height: 0; height: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pick-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.pick-titles { flex: 1 1 30ch; min-width: 0; }
.pick-titles h2 { font-size: 16px; font-weight: 800; }
.pick-say { color: var(--muted); font-size: 12.5px; }
.pick-xy { font: 700 14px var(--mono); min-width: 16ch; }
.pick-stage { position: relative; flex: 1 1 0; min-height: 0; overflow: auto; background: var(--screen); display: grid; place-items: center; }
.pick-holder { position: relative; line-height: 0; margin: auto; }
.pick-img { display: block; cursor: crosshair; }
.pick-img.fit { max-width: 100%; max-height: calc(100vh - 150px); width: auto; height: auto; }
.pick-img.real { max-width: none; }
.pick-loupe { position: absolute; z-index: 5; width: 150px; height: 150px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 6px 22px rgb(0 0 0 / .6); pointer-events: none; image-rendering: pixelated; }
.pick-pin { position: absolute; z-index: 3; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font); line-height: 1; color: #fff; background: rgb(123 92 250 / .82); border: 2px solid #fff; pointer-events: none; box-shadow: 0 0 0 1px #000; }
.pick-pin.other { z-index: 2; width: 18px; height: 18px; margin: -9px 0 0 -9px; font-size: 10px; background: rgb(30 27 46 / .7); border: 1.5px dashed rgb(255 255 255 / .85); box-shadow: none; }
.pick-first { display: grid; justify-items: center; width: 100%; }
.pick-first > .btn { margin: 0 0 18px; }
.pick-drop { margin: 24px; padding: 40px 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; border: 2px dashed var(--ghost); border-radius: 18px; background: var(--card); color: var(--ink); max-width: 560px; text-align: center; }
.pick-drop.over, .pick-drop:hover { border-color: var(--accent); background: var(--hover); }
.pick-keys { font-size: 18px; }
.pick-keys kbd { font-size: 16px; padding: 4px 10px; }
.pick-ways { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 8px 4px; padding: 16px; }
.pick-ways .pick-drop { margin: 8px; flex: 1 1 260px; }
.pick-capture { border-style: solid; border-color: var(--accent); }
.pick-capture strong { font: 800 18px var(--round); }
.pick-or { align-self: center; color: #B5AFCA; font-weight: 600; }
.pick-only { font-weight: 700; font-size: 13.5px; background: var(--note-warn); color: var(--note-warn-ink); border-radius: 9px; padding: 6px 10px; }
.pick-only.good { background: var(--note); color: var(--note-ink); }
.note { margin: 8px 0 0; padding: 8px 10px; border-radius: 9px; font-size: 13px; white-space: pre-line; background: var(--note); color: var(--note-ink); }
.note.warn { background: var(--note-warn); color: var(--note-warn-ink); }
.note[hidden] { display: none; }
.pick-liveview { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px; width: 100%; }
.pick-live { display: block; max-width: 100%; max-height: calc(100vh - 250px); border-radius: 8px; box-shadow: 0 0 0 2px var(--accent); background: #000; }
.pick-actions { justify-content: center; }
.pick-live.wrong { max-height: calc(100vh - 380px); opacity: .45; box-shadow: 0 0 0 2px var(--danger); }
.pick-wrong { max-width: 62ch; text-align: center; color: #fff; font-weight: 600; font-size: 15px; }
.pick-mon { position: absolute; border: 3px solid var(--accent); background: rgb(123 92 250 / .12); color: #fff; display: grid; place-items: center; border-radius: 4px; }
.pick-mon:hover { background: rgb(123 92 250 / .4); }
.pick-mon span { background: rgb(0 0 0 / .7); padding: 6px 12px; border-radius: 8px; font: 700 14px var(--font); line-height: 1.2; }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 860px) {
  body { overflow: auto; }
  html, body, #app { height: auto; min-height: 100%; }
  .page { flex: none; }
  .welcome { grid-template-columns: minmax(0, 1fr); }
  .welcome-art { order: -1; padding: 4px; }
  .welcome-art .fieldbub { --fz: .7; }
  .zones { flex-direction: column; overflow: visible; flex: none; }
  .zones.two .zone-models { flex: none; border-left: 0; padding-left: 0; border-top: 1px dashed var(--line); padding-top: 10px; width: 100%; }
  .tray { flex-direction: column; height: auto; }
  .tray .stage { min-height: 200px; }
  .tray-side { width: auto; }
  .work { flex-direction: column; flex: none; }
  .stage-card { min-height: 420px; flex: none; }
  .side-panel, .monitor { flex: none; max-height: 380px; }
  .status { flex-basis: 100%; text-align: left; order: 9; }
  .quick-cols { grid-template-columns: minmax(0, 1fr); }
  .split { flex-wrap: wrap; }
  .set-l { width: 7.5ch; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

ast one step (to take it away, delete the bubble).":"A bolha precisa de pelo menos um passo (para tirá-la, exclua a bolha).","A device only shows up here if it has at least one macro: create any macro on it in iCUE before exporting.":"Um dispositivo só aparece aqui se tiver pelo menos uma macro: crie uma macro qualquer nele no iCUE antes de exportar.","A key combination needs at least two keys.":"Uma combinação precisa de pelo menos duas teclas.","A key the browser keeps for itself (Windows key, some media keys)? Use the on-screen keyboard.":"É uma tecla que o navegador guarda para ele (tecla Windows, algumas de mídia)? Use o teclado na tela.","A page can't see the folders of the computer: paste the full path here. In Windows, hold Shift, right-click the file and choose “Copy as path”.":"Uma página não enxerga as pastas do computador: cole aqui o caminho completo. No Windows, segure Shift, clique com o botão direito no arquivo e escolha “Copiar como caminho”.","A point every:":"Um ponto a cada:","A profile needs to keep at least one macro.":"Um perfil precisa ficar com pelo menos uma macro.","A save is still waiting for your answer. Try again in a moment.":"Um salvamento ainda espera a sua resposta. Tente de novo daqui a pouco.","A set with a name is a structure of the macro, like “Preparation”. Names are kept in this browser and come back when you open the profile again.":"Um conjunto com nome é uma estrutura da macro, como “Preparação”. Os nomes ficam guardados neste navegador e voltam quando você abre o perfil de novo.","A sound file (.wav) that iCUE plays when this macro is started by its key.":"Um arquivo de som (.wav) que o iCUE toca quando esta macro é iniciada pela tecla dela.","A spot of the screen":"Um ponto da tela","A wait of any length. iCUE only takes 9999 ms in one step, so a long wait is made of many short ones.":"Uma espera de qualquer tamanho. O iCUE só aceita 9999 ms em um passo, então a espera longa é feita de várias curtas em seguida.","Accents iser.","Played by: {names}":"Usada por: {names}","Plays all of that macro's steps. If you change that macro later,\nthis one follows the change.":"Executa todos os passos daquela macro. Se você mudar aquela macro depois,\nesta acompanha a mudança.","Please choose a key.":"Escolha uma tecla.","Please choose a macro.":"Escolha uma macro.","Please give the new macro a name.":"Dê um nome para a nova macro.","Please say how long to wait.":"Diga quanto tempo esperar.","Please type some text.":"Digite algum texto.","Point at WHERE IT GOES":"Aponte para ONDE O ITEM VAI","Point at the ITEM to drag":"Aponte para o ITEM a arrastar","Point at the spot":"Aponte para o ponto","Point at the spot to click":"Aponte para o ponto do clique","Preparation":"Preparação","Press Enter at the end":"Apertar Enter no final","Press a key":"Aperte uma tecla","Press once to start, again to stop":"Apertar uma vez para iniciar, de novo para parar","Press one key several times":"Apertar uma tecla várias vezes","Press the key you want now…":"Aperte agora a tecla que você quer…","Press the key…":"Apertar a tecla…","Press to start, press again to stop":"Apertar para iniciar, apertar de novo para parar","Presses a key and clicks - where the mouse is, or at a spot of the screen.":"Aperta uma tecla e clica - onde o mouse estiver, ou num ponto da tela.","Presses keys (and clicks) over and over while you hold the macro key — or on/off.":"Aperta teclas (e clica) sem parar enquanto você segura a tecla da macro — ou liga/desliga.","Presses keys in order, once: a series of shortcuts, a combo, the way through a menu.":"Aperta as teclas em ordem, uma vez: uma série de atalhos, um combo, o caminho por um menu.","Presses the button on an item without releasing, drags it to another spot and releases — optionally typing a quantity afterwards.":"Aperta o botão em cima do item sem soltar, arrasta até outro ponto e solta — e, se quiser, digita uma quantidade depois.","Preview":"Prévia","Preview: nothing is really pressed or clicked.   Click or Space: pause   ·   Esc: close":"Prévia: nada é apertado nem clicado de verdade.   Clique ou Espaço: pausa   ·   Esc: fecha","Quick macro":"Macro rápida","Raise the ones shorter than":"Aumentar as menores que","Random wait between two values (looks more human)":"Espera aleatória entre dois valores (parece mais humano)","Reading the profile…":"Lendo o perfil…","Ready-made pieces":"Modelos","Ready-made pieces: drag one to its place on the stage, or click it":"Modelos: arraste um até o lugar dele no palco, ou clique nele","Real size":"Tamanho real","Redo":"Refazer","Release a held key":"Soltar uma tecla segurada","Release a mouse button":"Soltar um botão do mouse","Release key   {k}":"Soltar tecla   {k}","Release {b} mouse button":"Soltar botão {b} do mouse","Remove":"Tirar","Remove drag":"Remover arraste","Remove spot":"Remover ponto","Repeat":"Repetir","Repeat a number of times":"Repetir algumas vezes","Repeat steps":"Repetir passos","Repeat these steps…":"Repetir estes passos…","Repeat until stopped":"Repetir até parar","Repeat while I hold the macro key":"Repetir enquanto eu seguro a tecla da macro","Repeated key":"Tecla repetida","Repeated keys / auto-click":"Teclas repetidas / auto-clique","Repetition":"Repetição","Right":"Direito","Round {i}":"Rodada {i}","Round {i} of {n}":"Rodada {i} de {n}","Same key many times in a row — e.g. Down arrow ×7 to walk a menu.":"A mesma tecla várias vezes seguidas — ex.: seta para baixo ×7 para andar num menu.","Save draft":"Salvar rascunho","Saved through claude.ai? The file comes inside a .zip: open it and drag the .cueprofile out to a folder first.":"Salvou pelo claude.ai? O arquivo vem dentro de um .zip: abra o .zip e arraste o .cueprofile para uma pasta antes.","Saving is not available in this view: on claude.ai a page like this one can only hand over files to someone who is signed in.\n\nThe same tool has a page of its own that saves for everyone, without an account:\n\n{url}\n\nOpen it there and open your profile again.":"Não dá para salvar nesta visualização: no claude.ai uma página como esta só consegue entregar arquivos a quem está com a conta aberta.\n\nA mesma ferramenta tem uma página própria, que salva para qualquer pessoa, sem conta:\n\n{url}\n\nAbra por lá e abra o seu perfil de novo.","Say how many times per second.":"Diga quantas vezes por segundo.","Scroll the list":"Rolar a lista","Scroll the mouse wheel":"Rolar a roda do mouse","Scroll wheel down {n}":"Rolar a roda para baixo {n}","Scroll wheel up {n}":"Rolar a roda para cima {n}","Search":"Buscar","See-through bubbles":"Bolhas translúcidas","Select a “Play macro” or “Repeat” row first.":"Selecione primeiro uma linha “Executar macro” ou “Repetir”.","Select all":"Selecionar tudo","Send to the end":"Enviar para o fim","Send to the end  (Ctrl+End)":"Enviar para o fim  (Ctrl+End)","Send to the start":"Enviar para o início","Send to the start  (Ctrl+Home)":"Enviar para o início  (Ctrl+Home)","Separate keys with spaces, e.g. “2 1 3 4”.":"Separe as teclas com espaço, ex.: “2 1 3 4”.","Separate keys with spaces, e.g. “3 4”.":"Separe as teclas com espaço, ex.: “3 4”.","Separate keys with spaces, e.g. “U 7 Y”.":"Separe as teclas com espaço, ex.: “U 7 Y”.","Set the waits for me: say how many times per second":"Calcular as esperas: dizer quantas vezes por segundo","Shortcuts in a row":"Atalhos em sequência","Shorter":"Mais curta","Show every step (ungroup everything)":"Mostrar todos os passos (desagrupar tudo)","Show macros in grouped form when opening a profile":"Mostrar as macros agrupadas ao abrir um perfil","Something went wrong here: {e}":"Algo deu errado aqui: {e}","Something went wrong while saving:\n\n{e}":"Algo deu errado ao salvar:\n\n{e}","Sound played when the macro starts":"Som tocado quando a macro começa","Sound…":"Som…","Spot {n}: click its new place":"Ponto {n}: clique no lugar novo","Spot {n}: point at it":"Ponto {n}: aponte para ele","Started along with: {names}":"Iniciada junto com: {names}","Step this program doesn't know ({kind}) — kept exactly as it is":"Passo que este programa não conhece ({kind}) — mantido exatamente como está","Steps":"Passos","Stop showing the screen":"Parar de mostrar a tela","Structure":"Estrutura","Sweep an area (key + click on a grid)":"Varredura de área (tecla + clique em grade)","Switch window (Alt+Tab)":"Trocar de janela (Alt+Tab)","Tab jumps to the next field, Enter confirms or starts a new line - and the typing goes on.\nAlso: {esc}  {up}  {down}  {left}  {right}  {backspace}  {F5}…":"Tab pula para o próximo campo, Enter confirma ou muda de linha - e a digitação continua.\nTambém: {esc}  {cima}  {baixo}  {esquerda}  {direita}  {apagar}  {F5}…","Tab presses to come back:":"Tabs para voltar:","Tab presses to get there:":"Tabs para chegar lá:","Take a picture of the screen":"Tire uma foto da tela","Take or paste a new picture. The spots already marked stay.":"Tire ou cole uma foto nova. Os pontos já marcados ficam.","Take the group apart":"Desfazer o conjunto","Take the picture of the screen":"Tire a foto da tela","Tap a key (press + release)":"Tocar uma tecla (apertar + soltar)","Tap key   {k}":"Tocar tecla   {k}","Text to type:":"Texto para digitar:","That file is not a picture the browser can open.":"Esse arquivo não é uma imagem que o navegador consiga abrir.","That is a window: the whole screen is needed":"Isso é uma janela: precisa ser a tela inteira","That is faster than this spam can go: a click alone holds the button 5 ms.":"Mais rápido do que este spam consegue: só o clique segura o botão por 5 ms.","That key ({code}) is not in the list of keys this tool knows. Try another one, or the on-screen keyboard.":"Essa tecla ({code}) não está na lista de teclas que esta ferramenta conhece. Tente outra, ou o teclado na tela.","That macro already plays this one, so they would play each other forever.":"Aquela macro já executa esta, então uma ficaria executando a outra para sempre.","That makes {rate} times per second":"Isso dá {rate} vezes por segundo","That will show {n} separate steps, which makes this macro slow to edit.\n\nContinue?":"Isso vai mostrar {n} passos separados, o que deixa esta macro lenta de editar.\n\nContinuar?","That would be {n} points: use a bigger distance between them.":"Seriam {n} pontos: use uma distância maior entre eles.","That would leave too many loose steps: set it to 1 time first.":"Isso deixaria passos soltos demais: coloque em 1 vez antes.","The amount":"A quantidade","The browser is asking what to show: open “Entire screen” (not “Window”) and choose the screen you want to click on.":"O navegador está perguntando o que mostrar: abra “Tela inteira” (não “Janela”) e escolha a tela em que você quer clicar.","The distance":"A distância","The draft is open again. To use it in iCUE, export.":"O rascunho foi reaberto. Para usar no iCUE, exporte.","The drawings are illustrations: your iCUE may look a little different, the names of the options are the same.":"Os desenhos são ilustrações: o seu iCUE pode estar um pouco diferente, mas os nomes das opções são os mesmos.","The file could not be saved here ({code}).":"Não deu para salvar o arquivo aqui ({code}).","The increase":"O aumento","The key also keeps its normal function":"A tecla também mantém a função normal","The key didn't go along: choose a key of the new device with “Change…”.":"A tecla não foi junto: escolha uma tecla do novo dispositivo em “Mudar…”.","The macro “{name}”":"A macro “{name}”","The names are iCUE's own: the key in that place of the keyboard, whatever is printed on yours.":"Os nomes são os do iCUE: a tecla que fica naquele lugar do teclado, seja qual for a letra impressa no seu.","The number of copies":"O número de cópias","The number of hops":"O número de etapas","The number of times":"O número de vezes","The picture of the screen did not come. Try again.":"A foto da tela não veio. Tente de novo.","The picture stays in this page: it is not sent anywhere.":"A imagem fica nesta página: não é enviada para lugar nenhum.","The screenshot shows {n} monitors. iCUE's moves count from the corner of the main monitor and reach no other: click the main one.":"O print mostra {n} monitores. Os movimentos do iCUE contam a partir do canto do monitor principal e não alcançam os outros: clique no principal.","The steps of this bubble":"Os passos desta bolha","The text is stored as plain key presses in the profile file — keep that in mind before sharing it.":"O texto fica gravado como teclas comuns no arquivo do perfil — lembre disso antes de compartilhar.","The time":"O tempo","The value":"O valor","The wait":"A espera","Their keys become free.":"As teclas delas ficam livres.","Then type (optional):":"Depois digitar (opcional):","There are no changes to keep.":"Não há alterações para guardar.","There are no changes to save.":"Não há alterações para salvar.","There are no waits to adjust.":"Não há esperas para ajustar.","There is a draft of “{file}” that was not exported yet (last change at {time}).\n\nGo on from where you stopped?":"Há um rascunho de “{file}” que ainda não foi exportado (última alteração às {time}).\n\nContinuar de onde parou?","There is nothing to play yet.":"Ainda não há nada para tocar.","These characters can't be typed and will be skipped:\n{chars}\n\nContinue?":"Estes caracteres não podem ser digitados e serão ignorados:\n{chars}\n\nContinuar?","This applies the next time a profile is opened.":"Isso vale na próxima vez que um perfil for aberto.","This browser could not show the screen here ({why}). Use Print Screen and Ctrl+V.":"Este navegador não conseguiu mostrar a tela aqui ({why}). Use Print Screen e Ctrl+V.","This browser doesn't let this page keep a draft here. Use “Export” to keep the work in a file.":"Este navegador não deixa esta página guardar um rascunho aqui. Use “Exportar” para guardar o trabalho num arquivo.","This is an example with made-up macros, to try things out. Open your own profile from iCUE to edit and save for real.":"Este é um exemplo com macros inventadas, para experimentar. Abra o seu perfil do iCUE para editar e salvar de verdade.","This is the example: there is no profile file behind it. Open your own profile from iCUE to save.":"Este é o exemplo: não existe um arquivo de perfil por trás dele. Abra o seu perfil do iCUE para salvar.","This is the example: there is nothing of yours to keep.":"Este é o exemplo: não há nada seu para guardar.","This key:":"Esta tecla:","This keyboard has no key for:   {chars}\nThey will be left out of the text.":"Esse teclado não tem tecla para:   {chars}\nEles vão ficar de fora do texto.","This picture is smaller than the screen: if it is a cut of the screen, the numbers will be off. A whole Print Screen is the safe way.":"Esta imagem é menor que a tela: se for um recorte da tela, os números vão sair errados. Um Print Screen inteiro é o jeito seguro.","This profile only has macros on one device.":"Este perfil só tem macros em um dispositivo.","This screenshot seems to hold more than one monitor and they could not be told apart: the numbers count from the top left corner of the picture.":"Este print parece ter mais de um monitor e não deu para separá-los: os números contam a partir do canto de cima à esquerda da imagem.","This step is of a kind this program doesn't know, so it can't be edited here. It can be moved, copied or deleted, and is saved exactly as it is.":"Este passo é de um tipo que este programa não conhece, então não dá para editá-lo aqui. Ele pode ser movido, copiado ou excluído, e é salvo exatamente como está.","This view can't save files: on claude.ai that needs a signed-in account. Use the page that saves for everyone before you edit, or your changes will have nowhere to go.":"Esta visualização não consegue salvar arquivos: no claude.ai isso exige estar com a conta aberta. Use a página que salva para todo mundo antes de editar, senão as alterações não terão para onde ir.","This works on a “Go to” bubble with more than one spot.":"Isso vale para uma bolha “Ir até” com mais de um ponto.","Throw it away":"Descartar","Times in all:":"Vezes ao todo:","Times per second:":"Vezes por segundo:","Tip: for many copies, “Repeat…” keeps the steps written once and is easier to change.":"Dica: para muitas cópias, “Repetir…” mantém os passos escritos uma vez só e é mais fácil de mudar.","Tips":"Dicas","To":"Até","Together with the Fn key":"Junto com a tecla Fn","Try with an example":"Experimentar com um exemplo","Turn on “{a}” and “{b}”: the macros and their keys only go into the file with these two. The other options make no difference here.":"Ligue “{a}” e “{b}”: as macros e as teclas delas só entram no arquivo com essas duas. As outras opções tanto faz aqui.","Turn the mouse wheel":"Girar a roda do mouse","Turns the mouse wheel a number of notches, up or down.":"Gira a roda do mouse um número de vezes, para cima ou para baixo.","Type X and Y…":"Digitar X e Y…","Type a greeting":"Digitar saudação","Type a spot…":"Digitar um ponto…","Type a text":"Digitar um texto","Type numbers on the numeric keypad":"Digitar os números no teclado numérico","Types a text - letters, numbers, accents, symbols - optionally pressing Enter at the end.":"Digita um texto - letras, números, acentos, símbolos - e, se quiser, aperta Enter no final.","US (no accents)":"EUA (sem acentos)","US International":"EUA Internacional","US International (' and then a types á)":"EUA Internacional (' e depois a digita á)","Undo":"Desfazer","Ungroup the selected “Repeat” / “Play macro”":"Desagrupar o “Repetir” / “Executar macro” selecionado","Up":"Cima","Up (away from you)":"Para cima (para longe de você)","Use Print Screen instead":"Usar Print Screen","Use a negative number to subtract (never goes below 0).":"Use um número negativo para diminuir (nunca fica abaixo de 0).","Use hops if the program ignores the drag when the mouse jumps to the end.":"Use saltos se o programa ignorar o arrasto quando o mouse pula direto para o fim.","Use these keys":"Usar estas teclas","Use these spots":"Usar estes pontos","Use this spot":"Usar este ponto","Version {v}":"Versão {v}","Wait":"Esperar","Wait (any length)":"Espera (de qualquer tamanho)","Wait at the point, before acting:":"Espera no ponto, antes de agir:","Wait before releasing:":"Esperar antes de soltar:","Wait between actions:":"Espera entre as ações:","Wait between copies:":"Espera entre as cópias:","Wait between drags:":"Espera entre os arrastes:","Wait between keys:":"Espera entre as teclas:","Wait between letters":"Espera entre as letras","Wait between letters:":"Espera entre as letras:","Wait between notches:":"Espera entre os giros:","Wait between one time and the next:":"Espera entre uma vez e a próxima:","Wait between parts":"Espera entre as partes","Wait between points:":"Espera entre os pontos:","Wait between presses:":"Espera entre os apertos:","Wait between spots:":"Espera entre os pontos:","Wait between the key and the click:":"Espera entre a tecla e o clique:","Wait for":"Esperar","Wait {lo} to {hi} ms (random)":"Esperar de {lo} a {hi} ms (aleatório)","Wait {ms} ms":"Esperar {ms} ms","Wait: {pause} ms between one time and the next.":"Espera: {pause} ms entre uma vez e a próxima.","Waits: {gap} ms between the keys and {pause} ms before the next time.":"Esperas: {gap} ms entre as teclas e {pause} ms antes da próxima vez.","Walk the menu":"Descer o menu","Watch the macro play: a shot flies through the bubbles at the macro's own speed\nand each one shows the keys, clicks and mouse moves it would send.\nNothing is really pressed or clicked.":"Veja a macro rodando: um disparo atravessa as bolhas na velocidade da própria macro\ne cada uma mostra as teclas, os cliques e os movimentos do mouse que enviaria.\nNada é apertado nem clicado de verdade.","What flies through the macro":"O que voa pela macro","What happens when the macro is stopped half-way (key released, or pressed again):\nstop right away, or finish the current run first.":"O que acontece quando a macro é parada no meio (tecla solta, ou apertada de novo):\nparar na hora, ou terminar a execução atual antes.","What kind of macro?":"Que tipo de macro?","What should this step do?":"O que este passo deve fazer?","What you pasted is not a picture. Press Print Screen first, then Ctrl+V here.":"O que você colou não é uma imagem. Aperte Print Screen primeiro e depois Ctrl+V aqui.","When":"Quando","When its key is let go:":"Quando a tecla é solta:","When this macro starts:":"Quando esta macro começa:","When this macro stops:":"Quando esta macro para:","Where the sound file is on the computer that runs iCUE (.wav):":"Onde o arquivo de som está no computador que roda o iCUE (.wav):","Where?":"Onde?","Which device should the new macro belong to?":"Em qual dispositivo a nova macro deve ficar?","Which key of “{device}” starts the macro “{name}”?":"Qual tecla de “{device}” inicia a macro “{name}”?","Which keyboard is Windows set to, where the macros run?":"Qual é o teclado configurado no Windows, onde as macros rodam?","Which one is the main monitor?":"Qual é o monitor principal?","With 50 and 20 the waits are 50, 70, 90, 110… ms. A negative number makes them shorter and shorter instead.":"Com 50 e 20 as esperas ficam 50, 70, 90, 110… ms. Um número negativo faz o contrário: cada vez menores.","With what you want to click on showing, press Print Screen, come back here and press Ctrl+V.":"Com o que você quer clicar aparecendo na tela, aperte Print Screen, volte aqui e aperte Ctrl+V.","Works in every case: a program in full screen or in a window.":"Funciona em qualquer caso: programa em tela cheia ou em janela.","Wrap-up":"Finalização","X (right)":"X (direita)","X/Y are screen pixels, counted from the top-left corner of the main monitor.\n“Pick on screen…”: paste a screenshot and click the spot on it.":"X/Y são pixels da tela, contados a partir do canto de cima à esquerda do monitor principal.\n“Escolher na tela…”: cole um print e clique no ponto.","Y (down)":"Y (baixo)","Yes":"Sim","You can also drop the .cueprofile file anywhere on this page. Everything happens in this page: the profile is not sent anywhere.":"Você também pode soltar o arquivo .cueprofile em qualquer lugar desta página. Tudo acontece aqui: o perfil não é enviado para lugar nenhum.","You can fine-tune each wait in the editor afterwards.":"Depois você pode ajustar cada espera no editor.","You changed steps of a macro that these macros play:\n\n{names}\n\nUpdate them too, so they play the new version?\n\nYes = update them      No = they keep playing the old steps":"Você alterou passos de uma macro que estas macros executam:\n\n{names}\n\nAtualizar essas também, para executarem a versão nova?\n\nSim = atualizar      Não = elas continuam com os passos antigos","You have changes that aren't exported yet.\n\nExport them first?":"Você tem alterações que ainda não foram exportadas.\n\nExportar antes?","Your macros":"Suas macros","Your sequence appears here.":"Sua sequência aparece aqui.","a macro played here no longer exists":"uma macro executada aqui não existe mais","amount":"quantidade","at start":"ao iniciar","at the end":"ao parar","click":"clicar","don't click":"não clicar","double-click":"clicar duas vezes","draft kept at {time}":"rascunho guardado às {time}","e.g. a quantity":"ex.: uma quantidade","empty":"vazio","empty: as long as the macro plays":"vazio: enquanto a macro estiver tocando","finish the current run first":"terminar a execução atual antes","from ({x1}, {y1}) to ({x2}, {y2})":"de ({x1}, {y1}) até ({x2}, {y2})","h":"h","hops (0 = jump straight there)":"etapas (0 = pula direto)","iCUE always makes a NEW profile when it imports: it never writes over one that is already there. Your macros are in the new profile; when you have checked them, delete the old one (or keep it as a backup).":"O iCUE sempre cria um perfil NOVO ao importar: ele nunca grava por cima de um que já existe. As suas macros estão no perfil novo; depois de conferir, exclua o antigo (ou deixe como reserva).","iCUE can start another macro of the profile together with “{name}”.":"O iCUE pode iniciar outra macro do perfil junto com “{name}”.","iCUE counts from the corner of the SCREEN. The picture of a window comes with its title bar and borders and doesn't say where the window is, so the spots would come out shifted.":"O iCUE conta a partir do canto da TELA. A foto de uma janela vem com a barra de título e as bordas dela e não diz onde a janela está, então os pontos sairiam deslocados.","iCUE's absolute moves only reach the main monitor: the spots count from its top left corner.":"Os movimentos absolutos do iCUE só alcançam o monitor principal: os pontos contam a partir do canto de cima à esquerda dele.","iCUE's own screen only offers the last one (it calls it the “second assignment”). Tested in iCUE (November 2026): “when it starts” and “when the key is let go” work; “when it stops” did not show in the test.\niCUE does not play the sound of a macro started this way.":"A tela do iCUE só oferece a última (ele chama de “segunda atribuição”). Testado no iCUE (novembro de 2026): “ao iniciar” e “ao soltar a tecla” funcionam; “ao parar” não apareceu no teste.\nO iCUE não toca o som de uma macro iniciada desta forma.","iCUE's “retain original key output”: the key still types / acts as usual\nand starts the macro as well.":"É o “manter a saída original da tecla” do iCUE: a tecla continua digitando / agindo normalmente\ne também inicia a macro.","it plays that many times and stops":"faz essa quantidade e para","keyboard":"teclado","keyboard + mouse":"teclado + mouse","last change at {time}":"última alteração às {time}","left":"esq.","middle":"meio","milliseconds":"milissegundos","min":"min","mouse":"mouse","ms between":"ms entre elas","no area marked yet":"nenhuma área marcada ainda","no key":"sem tecla","no spot marked yet (or type it)":"nenhum ponto marcado ainda (clique aqui para digitar)","no unsaved changes":"nenhuma alteração pendente","none":"nenhuma","
