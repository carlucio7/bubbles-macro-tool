  });
  var lastError = 0;
  function failed(what) {                // something broke: say so instead of going quiet (once every few seconds at most)
    var now = Date.now();
    if (/ResizeObserver loop/i.test(String(what)) || now - lastError < 4000) { return; }     // (the first is only the browser thinking aloud)
    lastError = now;
    U.toast(_("Something went wrong here: {e}", { e: String(what).slice(0, 160) }), "warn", 8000);
  }
  window.addEventListener("error", function (e) { failed(e.message || e.error || "?"); });
  window.addEventListener("unhandledrejection", function (e) { failed((e.reason && e.reason.message) || e.reason || "?"); });
  // ================================================================ the work kept safe while it isn't saved
  /* Until it is saved, the work lives only in this page: F5, a crash or the page going down would lose it.
     So the open profile and every change are kept in this browser (IndexedDB - nothing leaves the
     computer), a moment after each change and when the page closes; opening the page again offers them
     back. Saving, or saying no, forgets them. (Where the browser has no such storage - inside a claude.ai
     artifact, say - this quietly does nothing.) */
  var rescueDb = null, rescueTimer = 0, rescueText = null, keptJson = null, keptAt = 0;
  var KEPT = ["name", "device", "steps", "binding", "layer", "trigger", "repeat", "count", "rdelay", "termination", "retain", "sound", "attached"];
  function idb() {
    if (!rescueDb) {
      rescueDb = new Promise(function (resolve) {
        try {
          var rq = indexedDB.open("bubbles-rescue", 1);
          rq.onupgradeneeded = function () { rq.result.createObjectStore("work"); };
          rq.onsuccess = function () { resolve(rq.result); };
          rq.onerror = rq.onblocked = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    }
    return rescueDb;
  }
  function idbDo(mode, fn) {             // -> Promise of the request's result (null when there is no storage)
    return idb().then(function (db) {
      if (!db) { return null; }
      return new Promise(function (resolve) {
        try {
          var rq = fn(db.transaction("work", mode).objectStore("work"));
          rq.onsuccess = function () { resolve(rq.result === undefined ? null : rq.result); };
          rq.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    });
  }
  function rescueSoon() { clearTimeout(rescueTimer); rescueTimer = setTimeout(keepWork, 900); }
  function workState(s) {                // what is kept of the work - and its text, to see whether it changed
    var c = app.compose && app.compose.lines.length ? app.compose : null, nameEl = document.getElementById("compose-name");
    var state = {
      name: s.fileName, size: s.text.length, page: app.page, current: s.current, deleted: s.deleted.slice(),
      models: s.models.map(function (m) {
        var o = { key: m.key, isNew: !!m.isNew };
        KEPT.forEach(function (f) { o[f] = m[f]; });
        return o;
      }),
      compose: c ? { lines: c.lines.slice(), gap: c.gap, name: nameEl ? nameEl.value : "" } : null
    };
    return [state, JSON.stringify(state)];
  }
  function keepWork() {                  // -> Promise of true when the work is kept (written now or already)
    clearTimeout(rescueTimer);
    var s = ses();
    if (!s || app.example || !s.text) { return Promise.resolve(false); }   // (the example has no file behind it)
    var c = app.compose && app.compose.lines.length;
    if (!s.unsaved() && !c) {            // nothing to keep: no copy of the profile stays behind
      if (rescueText) { keptJson = null; keptAt = 0; forgetWork(); }
      return Promise.resolve(false);
    }
    var w = workState(s), state = w[0];
    if (rescueText === s && w[1] === keptJson) { return Promise.resolve(true); }
    state.at = Date.now();
    var first = rescueText === s ? Promise.resolve(true) : idbDo("readwrite", function (st) { return st.put({ name: s.fileName, text: s.text }, "text"); });
    rescueText = s;
    return first.then(function () { return idbDo("readwrite", function (st) { return st.put(state, "state"); }); }).then(function (r) {
      if (r === null) { rescueText = null; return false; }               // (no storage here)
      keptJson = w[1]; keptAt = state.at;
      if (top.status) { updateTop(); }
      return true;
    });
  }
  function saveDraft() {
    var s = ses();
    if (!s) { return; }
    if (app.example) { U.toast(_("This is the example: there is nothing of yours to keep.")); return; }
    if (!s.unsaved() && !(app.compose && app.compose.lines.length)) { U.toast(_("There are no changes to keep.")); return; }
    keepWork().then(function (ok) {
      if (!ok) { D.message(_("This browser doesn't let this page keep a draft here. Use “Export” to keep the work in a file.")); return; }
      U.toast(_("Draft saved at {time}. Open this page again in this browser and it comes back. To use the macros in iCUE, export.",
                { time: new Date(keptAt).toTimeString().slice(0, 5) }), "good", 6500);
    });
  }
  function forgetWork() {
    rescueText = null; keptJson = null; keptAt = 0;
    return idbDo("readwrite", function (st) { return st.clear(); });
  }
  function loadDraft() {                 // -> Promise of the kept work {state, kept} or null
    return idbDo("readonly", function (st) { return st.get("state"); }).then(function (state) {
      if (!state || !state.models) { return null; }
      return idbDo("readonly", function (st) { return st.get("text"); }).then(function (kept) {
        if (!kept || kept.name !== state.name || !kept.text || kept.text.length !== state.size) { forgetWork(); return null; }
        return { state: state, kept: kept };
      });
    });
  }
  function draftStamp(state) {
    var when = new Date(state.at), today = when.toDateString() === new Date().toDateString();
    return today ? when.toTimeString().slice(0, 5) : when.toLocaleDateString() + " " + when.toTimeString().slice(0, 5);
  }
  function draftOffer() {                // on the welcome page: a button that goes on with the draft, when there is one
    var spot = h("div.draft-offer", { hidden: true });
    loadDraft().then(function (d) {
      if (!d) { return; }
      U.add(spot, [h("button.btn.big.draft-btn", { type: "button", onclick: function () { openDraft(d); } },
                     "📝  " + _("Go on with the draft: {file}", { file: d.state.name })),
                   h("span.hint", _("last change at {time}", { time: draftStamp(d.state) }))]);
      spot.hidden = false;
    });
    return spot;
  }
  function openDraft(d) {
    var state = d.state, kept = d.kept;
    if (!openText(kept.text, kept.name)) { return; }
    var s = ses(), byKey = {};
    s.models.forEach(function (m) { byKey[m.key] = m; });
    s.models = state.models.map(function (o) {
      var m = !o.isNew && byKey[o.key];
      if (!m) { return new M.MacroModel(Object.assign({}, o, { isNew: true })); }
      KEPT.forEach(function (f) { m[f] = Array.isArray(o[f]) ? o[f].slice() : o[f] && typeof o[f] === "object" ? Object.assign({}, o[f]) : o[f]; });
      return m;                          // (the macro of the file keeps what it was: it shows as changed)
    });
    s.deleted = state.deleted || [];
    s.current = state.current && s.model(state.current) ? state.current : null;
    home = macro = null;
    showPage(state.page === "macro" && s.current ? "macro" : "home");
    if (state.compose && home && app.page === "home") { home.resume(state.compose); }
    rescueText = s; keptJson = workState(s)[1]; keptAt = state.at;
    updateTop();
    U.toast(_("The draft is open again. To use it in iCUE, export."), "good", 6000);
  }
  function offerRescue() {
    loadDraft().then(function (d) {
      if (!d) { return; }
      return D.ask(_("There is a draft of “{file}” that was not exported yet (last change at {time}).\n\nGo on from where you stopped?", { file: d.state.name, time: draftStamp(d.state) }),
                   { title: _("Draft"), yes: _("Go on"), no: _("Throw it away"), cancel: _("Decide later") }).then(function (r) {
        if (r === "no") { forgetWork(); showPage(app.page); return; }
        if (r === "yes") { openDraft(d); }
      });
    });
  }
  window.addEventListener("pagehide", keepWork);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { keepWork(); } });

  window.addEventListener("beforeunload", function (e) {
    var s = ses();
    if (!s || app.example || !s.unsaved()) { return; }
    if (rescueText === s && s.text && workState(s)[1] === keptJson) { return; }      // (it is kept: it comes back when the page opens)
    e.preventDefault(); e.returnValue = "";
  });
  function start() {
    applyLook();
    buildShell();
    onDrop(document.body);
    checkSaving();
    U.detectKeyboard();
    offerRescue();
  }
  app.parts = function () { return { home: home, macro: macro }; };       // (for the tests)
  app.start = start; app.openText = openText; app.openExample = openExample; app.save = save; app.showPage = showPage;
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", start); } else { start(); }
})(window.Bubbles);

</script>
</body></html>
